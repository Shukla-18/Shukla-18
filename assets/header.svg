<g class="t4">
  <circle class="dg" cx="163" cy="220" r="5" fill="#00ff88" filter="url(#glow)"/>
  <text x="176" y="224" font-family="Courier New,Courier,monospace" font-size="10" fill="#94a3b8" letter-spacing="2.5">SYSTEM ONLINE</text>
  <line x1="302" y1="212" x2="302" y2="229" stroke="#1e3a5f" stroke-width="1"/>
  <circle class="dc" cx="322" cy="220" r="5" fill="#00d4ff" filter="url(#glow)"/>
  <text x="335" y="224" font-family="Courier New,Courier,monospace" font-size="10" fill="#94a3b8" letter-spacing="2.5">SECURITY MODE ACTIVE</text>
  <line x1="528" y1="212" x2="528" y2="229" stroke="#1e3a5f" stroke-width="1"/>
  <circle class="da" cx="548" cy="220" r="5" fill="#f59e0b" filter="url(#glow)"/>
  <text x="561" y="224" font-family="Courier New,Courier,monospace" font-size="10" fill="#94a3b8" letter-spacing="2.5">BUILDING SECURITY TOOLS</text>
</g>
<text x="38" y="263" font-family="Courier New,Courier,monospace" font-size="11.5" fill="#00ff88" opacity=".85" class="t4">$ whoami  →  pratham@cyberlab</text>
<rect class="cu" x="261" y="250" width="8" height="13" fill="#00ff88" opacity=".8"/>
<text x="862" y="263" font-family="Courier New,Courier,monospace" font-size="9" fill="#1e3a5f" text-anchor="end" letter-spacing="1.5">GLA UNIVERSITY // MATHURA</text>
</svg>
