<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900">
<defs>
  <style>
    @keyframes scan{0%{transform:translateY(0px);opacity:.5}85%{opacity:.15}100%{transform:translateY(302px);opacity:0}}
    @keyframes pg{0%,100%{opacity:1}50%{opacity:.25}}
    @keyframes pc{0%,100%{opacity:1}50%{opacity:.3}}
    @keyframes pa{0%,100%{opacity:1}50%{opacity:.3}}
    @keyframes cur{0%,100%{opacity:1}50%{opacity:0}}
    @keyframes fi{from{opacity:0}to{opacity:1}}
    @keyframes fs{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .sl{animation:scan 6s linear infinite}
    .dg{animation:pg 2s ease-in-out infinite}
    .dc{animation:pc 2s ease-in-out .7s infinite}
    .da{animation:pa 2s ease-in-out 1.4s infinite}
    .cu{animation:cur 1s step-end infinite}
    .t1{animation:fi 1s ease-out .1s both}
    .t2{animation:fs 1s ease-out .5s both}
    .t3{animation:fs 1s ease-out .9s both}
    .t4{animation:fi 1s ease-out 1.3s both}
  </style>
  <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#1e3a5f" stroke-width=".35" opacity=".55"/>
  </pattern>
  <clipPath id="c"><rect width="900" height="300"/></clipPath>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="tlg" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0%" stop-color="#00d4ff" stop-opacity=".05"/>
    <stop offset="50%" stop-color="#00d4ff" stop-opacity=".18"/>
    <stop offset="100%" stop-color="#00d4ff" stop-opacity=".05"/>
  </linearGradient>
</defs>
<rect width="900" height="300" fill="#0a0e1a"/>
<rect width="900" height="300" fill="url(#g)"/>
<rect width="900" height="2" fill="#00d4ff" opacity=".75"/>
<rect y="298" width="900" height="2" fill="#00d4ff" opacity=".3"/>
<rect x="1" y="1" width="898" height="298" fill="none" stroke="#1e3a5f" stroke-width="1"/>
<path d="M28 75 L28 28 L75 28" fill="none" stroke="#00d4ff" stroke-width="1.8" stroke-linecap="square" filter="url(#glow)" class="t1"/>
<path d="M825 28 L872 28 L872 75" fill="none" stroke="#00d4ff" stroke-width="1.8" stroke-linecap="square" filter="url(#glow)" class="t1"/>
<path d="M28 225 L28 272 L75 272" fill="none" stroke="#00d4ff" stroke-width="1.8" stroke-linecap="square" filter="url(#glow)" class="t1"/>
<path d="M825 272 L872 272 L872 225" fill="none" stroke="#00d4ff" stroke-width="1.8" stroke-linecap="square" filter="url(#glow)" class="t1"/>
<circle cx="28" cy="28" r="2.5" fill="#00d4ff" opacity=".6" class="t1"/>
<circle cx="872" cy="28" r="2.5" fill="#00d4ff" opacity=".6" class="t1"/>
<circle cx="28" cy="272" r="2.5" fill="#00d4ff" opacity=".6" class="t1"/>
<circle cx="872" cy="272" r="2.5" fill="#00d4ff" opacity=".6" class="t1"/>
<rect class="sl" x="0" y="0" width="900" height="1.5" fill="#00d4ff" opacity=".22" clip-path="url(#c)"/>
<text x="38" y="50" font-family="Courier New,Courier,monospace" font-size="9.5" fill="#00d4ff" opacity=".55" letter-spacing="3.5" class="t1">CYBERSECURITY COMMAND CENTER</text>
<text x="862" y="50" font-family="Courier New,Courier,monospace" font-size="9.5" fill="#475569" text-anchor="end" letter-spacing="2.5" class="t1">SYS:ONLINE // v2.0</text>
<line x1="38" y1="58" x2="290" y2="58" stroke="#1e3a5f" stroke-width=".5"/>
