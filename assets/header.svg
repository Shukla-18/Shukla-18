<circle cx="810" cy="200" r="2" fill="#00d4ff" opacity=".3"/>
<rect x="120" y="108" width="660" height="52" fill="url(#tlg)" rx="1"/>
<text x="450" y="148" font-family="Segoe UI,Arial Black,Impact,sans-serif" font-weight="900" font-size="50" fill="#e2e8f0" text-anchor="middle" letter-spacing="7" class="t2">PRATHAM SHUKLA</text>
<text x="450" y="176" font-family="Courier New,Courier,monospace" font-size="13.5" fill="#00d4ff" text-anchor="middle" letter-spacing="4" class="t3">CYBERSECURITY  //  COMPUTER SCIENCE</text>
<line x1="115" y1="192" x2="785" y2="192" stroke="#1e3a5f" stroke-width=".8"/>
<line x1="115" y1="192" x2="280" y2="192" stroke="#00d4ff" stroke-width=".8" opacity=".5"/>
